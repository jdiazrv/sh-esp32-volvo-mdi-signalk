[platformio]
default_envs = sh-esp32

[env:sh-esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/patch_sensesp_persistence.py
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
# If your USB bridge fails at this speed, try upload_speed = 115200.
upload_speed = 921600

lib_deps =
  SignalK/SensESP @ 3.5.0
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
  adafruit/Adafruit SSD1306 @ ^2.5.1

build_flags =
  -std=gnu++17
  -D SENSESP_SK_WS_BUFFER_SIZE=4096
  -D LED_BUILTIN=2
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
  -D TAG='"Arduino"'
  # Both SensESP and the Arduino core spell this USE_ESP_IDF_LOG. Without it
  # Arduino-ESP32 reroutes ESP_LOGx to log_printf, which bypasses
  # esp_log_set_vprintf, so the SensESP web log viewer captures nothing.
  -D USE_ESP_IDF_LOG
build_unflags =
  -std=gnu++11

[env:sh-esp32-test]
extends = env:sh-esp32
build_unflags =
  ${env:sh-esp32.build_unflags}
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
build_flags =
  ${env:sh-esp32.build_flags}
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  -D VOLVO_MDI_TEST_MODE=1

[env:sh-esp32-ota]
extends = env:sh-esp32
upload_protocol = espota
upload_port = sh-esp32-volvo-mdi.local
upload_flags =
  --port=3232
  --auth=${sysenv.MDI_OTA_PASSWORD}
